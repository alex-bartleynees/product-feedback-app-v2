<div
  class="chip__container"
  role="button"
  tabindex="0"
  (click)="chipClick.emit()"
  (keydown.enter)="chipClick.emit()"
  [ngClass]="{
    'chip--active': active,
    'chip__container--arrow': showArrow,
    pointer: usePointer
  }"
>
  @if (showArrow) {
    <button class="arrow--up">
      <img
        src="/assets/icon-arrow-up.svg"
        alt="arrow up"
      />
    </button>
  }

  <p class="chip-text">{{ text() }}</p>
</div>
